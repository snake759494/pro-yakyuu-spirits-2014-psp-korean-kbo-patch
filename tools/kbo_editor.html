<style>

0px;padding:5px 11px;color:var(--muted);font-size:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.split{display:grid;grid-template-columns:minmax(300px,430px) minmax(0,1fr);gap:15px}.field{display:grid;gap:5px;min-width:0}.field label{font-size:12px;color:var(--muted)}input,select,textarea{min-width:0;width:100%;border:1px solid #405163;background:#111922;color:var(--text);border-radius:6px;padding:8px}input[type=color]{height:38px;padding:3px}input[type=checkbox]{width:auto;accent-color:var(--accent)}input[type=number]{font-variant-numeric:tabular-nums}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.row .field{flex:1}.small{font-size:12px;color:var(--muted)}.tablewrap{max-height:calc(100vh - 270px);overflow:auto;border:1px solid var(--line);border-radius:8px}.roster{width:100%;border-collapse:collapse;font-size:12px}.roster th{position:sticky;top:0;background:#283747;color:#c6d2de;text-align:left;padding:9px;z-index:1}.roster td{padding:7px 9px;border-top:1px solid #293642}.roster tr{cursor:pointer}.roster tbody tr:hover{background:#263544}.roster tr.sel{background:#44371f}.tag{padding:2px 6px;border-radius:10px;background:#354759;color:#d6e6f2;font-size:10px}.tag.active{background:#365c41;color:#c7f1d0}.section-title{font-size:15px;font-weight:700;margin:0 0 12px}.subsection{margin-top:17px;padding-top:14px;border-top:1px solid var(--line)}.editor-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}.editor-tabs button{font-size:12px}.editor-tabs button.active{background:#75501e}.playerhead{display:flex;gap:14px;align-items:center}.portrait{width:96px;height:108px;object-fit:cover;background:#0d1116;border-radius:8px;border:1px solid var(--line)}.facelarge{max-width:240px;max-height:270px;object-fit:contain;background:#0e1319;border:1px solid var(--line);border-radius:8px}.bodypreview{display:flex;gap:12px;align-items:flex-start}.ability{display:grid;grid-template-columns:repeat(3,minmax(100px,1fr));gap:8px}.pitchrow{display:grid;grid-template-columns:1.5fr repeat(3,minmax(58px,.55fr)) 36px;gap:6px;margin:6px 0;align-items:center}.pitchrow button{padding:5px}.assetgrid{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:10px}.assetcard{border:1px solid var(--line);border-radius:8px;padding:10px;background:#151e27}.assetpreview{height:125px;background:#0e141b;border:1px dashed #435362;border-radius:6px;display:flex;align-items:center;justify-content:center;margin:7px 0;overflow:hidden}.assetpreview img{max-width:100%;max-height:100%;object-fit:contain}.coloritem{display:grid;grid-template-columns:1fr 56px;align-items:center;gap:7px}.lineup-row{display:grid;grid-template-columns:repeat(2,minmax(120px,1fr)) 70px;gap:7px;margin:6px 0}.banner{padding:11px;border-radius:7px;background:#402d23;color:#ffd6ad;margin:8px 0}.banner.ok{background:#1d3828;color:#c4f2d1}.modalback{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:10}.modal{background:var(--panel);padding:22px;border:1px solid var(--line);border-radius:12px;width:min(760px,95vw);max-height:85vh;overflow:auto}.hidden{display:none!important}.checkbox{display:flex;align-items:center;gap:8px}.jsonarea{min-height:165px;font:12px/1.4 Consolas,monospace}.search{margin:10px 0}.empty{color:var(--muted);padding:30px;text-align:center}.footerhint{font-size:11px;color:var(--muted);margin:18px 0}.toast{position:fixed;right:18px;bottom:18px;background:#273a4b;border:1px solid #58728a;padding:12px 18px;border-radius:9px;z-index:20;box-shadow:0 6px 28px #0008;max-width:460px}.source{font-size:11px;overflow-wrap:anywhere;color:#9dbbd0}.kpi{font-size:21px;font-weight:700}.warnings{color:#ffd197}.file{font-size:11px;padding:6px}.mono{font-family:Consolas,monospace}
@media(max-width:900px){.layout{grid-template-columns:1fr}aside{position:static;border-right:0;border-bottom:1px solid var(--line)}.split{grid-template-columns:1fr}.tablewrap{max-height:340px}.assetgrid{grid-template-columns:repeat(2,minmax(140px,1fr))}.main{padding:14px}.top{padding:0 12px}.subtitle{display:none}}@media(max-width:580px){.grid,.grid3{grid-template-columns:1fr}.ability{grid-template-columns:repeat(2,minmax(100px,1fr))}.assetgrid{grid-template-columns:1fr}.actions button{padding:7px}.title{font-size:15px}.status{display:none}}

<body><header class="top"><div><div class="title">KBO 2026 선수·구단 편집기</div><div class="subtitle">프로야구스피리츠 2014 · 입력 데이터 편집 · ISO 빌드 별도</div></div><div class="status" id="saveStatus">불러오는 중…</div><div class="actions"><button id="saveBtn" onclick="saveDraft()">초안 저장</button><button class="primary" id="exportBtn" onclick="exportInput()">Codex 입력 패키지 내보내기</button></div></header>
<div class="layout"><aside><nav class="nav"><button id="navRoster" class="active" onclick="showPage('roster')">선수·능력치·외형</button><button id="navTeam" onclick="showPage('team')">구단·구장·유니폼·로고</button><button id="navLineup" onclick="showPage('lineup')">개막 편성·선발 타순</button><button id="navStaff" onclick="showPage('staff')">감독·코치</button><button onclick="showHelp()">사용 안내·검사</button></nav><div class="teamlist" id="teamList"></div><div class="sidefoot" id="sideMeta"></div></aside><main id="main" class="main"><div class="empty">데이터를 읽고 있습니다…</div></main></div><div id="toast" class="toast hidden"></div><div id="help" class="modalback hidden" onclick="if(event.target===this)this.classList.add('hidden')"><div class="modal"><div class="row"><h2 style="margin:0">사용 안내</h2><button style="margin-left:auto" onclick="document.getElementById('help').classList.add('hidden')">닫기</button></div><div id="helpContent"></div></div></div>
<script>
const TEAM_NAMES={HH:'한화 이글스',LG:'LG 트윈스',SS:'삼성 라이온즈',HT:'KIA 타이거즈',WO:'키움 히어로즈',KT:'KT 위즈',LT:'롯데 자이언츠',OB:'두산 베어스',NC:'NC 다이노스',SK:'SSG 랜더스'};
const CODES=['HH','LG','SS','HT','WO','KT','LT','OB','NC','SK'];const ABBR={HH:'한',LG:'L',SS:'삼',HT:'기',WO:'키',KT:'K',LT:'롯',OB:'두',NC:'N',SK:'S'};
const ABILITY_LABELS={trajectory:'탄도',contact_r:'우투수 상대 컨택',contact_l:'좌투수 상대 컨택',power:'파워',speed:'주력',arm:'어깨',catching:'포구',throwing:'송구',recovery:'회복',stamina:'투수 체력',starter:'선발 적성',reliever:'중계 적성',closer:'마무리 적성'};
const POS=['투수','포수','1루수','2루수','3루수','유격수','좌익수','중견수','우익수','지명타자'];const PITCHES=['포심','투심','슬라이더','커터','커브','너클커브','포크','체인지업','스플리터','싱커','서클체인지','슈트'];
const BRAND_TEXT=['name','city','stadium_name','stadium_short','stadium_display_name','stadium_english','stadium_model','uniform','source'];const COLOR_KEYS=['cap_color','home_color','away_color','alternate_color','pants_color','home_letter_color','away_letter_color','side_color'];
let state=null,base=null,page='roster',team='HH',selected=null,subtab='overview',dirty=false;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const x=$('toast');x.textContent=msg;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),4200)}function touch(){dirty=true;$('saveStatus').textContent='저장되지 않은 변경';$('saveStatus').style.color='var(--accent)'}
function playerKey(p){return String(p.identity.index)+'|'+String(p.identity.player_id)}function playerByKey(k){return state.players.find(p=>playerKey(p)===k)}function teamPlayers(code=team){return state.players.filter(p=>p.team_code===code).sort((a,b)=>a.identity.index-b.identity.index)}
async function api(path,obj){let r=await fetch(path,obj?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)}:{});let data=await r.json();if(!r.ok||data.ok===false)throw new Error(data.errors?data.errors.join('\n'):data.error||r.statusText);return data}
async function init(){try{const d=await api('/api/state');state=d.state;base=JSON.parse(JSON.stringify(state));renderTeams();$('sideMeta').innerHTML=`선수 <b>${state.players.length}</b>명<br>현재 입력 기준: 2026 개막 로스터<br>초안 ${d.saved?'불러옴':'새로 시작'}`;$('saveStatus').textContent=d.saved?'저장 초안 불러옴':'편집 가능';showPage('roster');}catch(e){$('main').innerHTML=`<div class="banner">자료를 읽지 못했습니다: ${esc(e.message)}</div>`}}
function renderTeams(){ $('teamList').innerHTML=CODES.map(c=>`<button class="${team===c?'active':''}" onclick="switchTeam('${c}')">${esc(ABBR[c])} · ${esc(TEAM_NAMES[c])}</button>`).join('') }
function switchTeam(c){team=c;selected=null;renderTeams();renderPage()}
function showPage(p){page=p;document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));({roster:'navRoster',team:'navTeam',lineup:'navLineup',staff:'navStaff'}[p]&&$( {roster:'navRoster',team:'navTeam',lineup:'navLineup',staff:'navStaff'}[p]).classList.add('active'));renderPage()}
function renderPage(){if(!state)return;if(page==='roster')renderRoster();if(page==='team')renderTeam();if(page==='lineup')renderLineup();if(page==='staff')renderStaff()}
function setVal(path,value){const [group,...rest]=path.split('.');let o=state;if(group==='player'){o=playerByKey(selected)}else if(group==='team'){o=state.teams[team];rest.shift()}for(let i=0;i<rest.length-1;i++)o=o[rest[i]];if(path.endsWith('front_seam')&&typeof value==='string'){try{value=JSON.parse(value)}catch{return toast('재봉선 좌표를 JSON 배열로 입력하세요.')}}o[rest.at(-1)]=value;if(group==='player'){const p=o;if(path==='player.identity.name'){p.ratings.name=value;p.appearance.name=value}if(path==='player.identity.category')p.ratings.category=value;if(path==='player.team_code'){p.appearance.team=value;team=value;renderTeams()}if(path==='player.ratings.primary_position')p.identity.primary_position=value;if(path==='player.ratings.opening_entry')p.identity.opening_entry=value;if(path==='player.appearance.height'||path==='player.appearance.weight')p.identity[path.split('.').at(-1)]=value;if(path==='player.appearance.face_id')p.appearance.face_file=`F${value}.CHK`}if(path==='team.name')state.teams[team].branding.name=value;touch();if(page==='roster'&&(path==='player.team_code'||path==='player.identity.category'))renderPage()}
function input(label,path,value,type='text',opts={}){if(['team.abbreviation','team.branding.team_id','team.branding.uniform'].includes(path))return `<div class="field"><label>${esc(label)}</label><div class="pill">${esc(value)}</div></div>`;let id='f_'+Math.random().toString(36).slice(2);let attr=type==='number'?`min="${opts.min??''}" max="${opts.max??''}" step="${opts.step??1}"`:'';let ev=type==='checkbox'?`onchange="setVal('${path}',this.checked)"`:`onchange="setVal('${path}',${type==='number'?'Number(this.value)':'this.value'})"`;let val=type==='checkbox'?(value?'checked':''):`value="${esc(value)}"`;return `<div class="field"><label for="${id}">${esc(label)}</label><input id="${id}" type="${type}" ${attr} ${val} ${opts.readonly?'readonly':''} ${ev}></div>`}
function select(label,path,value,options){let id='f_'+Math.random().toString(36).slice(2);return `<div class="field"><label for="${id}">${esc(label)}</label><select id="${id}" onchange="setVal('${path}',${path.endsWith('primary_position')?'Number(this.value)':'this.value'})">${options.map(([v,l])=>`<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(l)}</option>`).join('')}</select></div>`}
function playerList(){let q=$('playerSearch')?.value?.trim().toLowerCase()||'';let cat=$('categoryFilter')?.value||'';let rows=teamPlayers().filter(p=>(!q||`${p.identity.name} ${p.identity.player_id} ${p.back_name||''}`.toLowerCase().includes(q))&&(!cat||p.identity.category===cat));return rows}
function renderRoster(){let rows=playerList();let p=selected&&playerByKey(selected);if(!p&&rows.length){selected=playerKey(rows[0]);p=rows[0]}
 $('main').innerHTML=`<div class="pagehead"><div><h1>${esc(state.teams[team].name)} 선수 편집</h1><p>신상·등록·능력치·포지션·구종·얼굴·체형을 슬롯 연결을 유지하며 편집합니다.</p></div><div class="stats"><span class="pill">${teamPlayers().length}명</span><span class="pill">1군 ${teamPlayers().filter(x=>x.ratings.opening_entry).length}</span><span class="pill">게임 슬롯 고정</span></div></div><div class="notice">게임 슬롯과 KBO 선수 ID는 데이터 연결 기준으로 고정됩니다. 선수 이동은 구단 선택을 바꾸면 반영됩니다. 신인 추가나 슬롯 삭제는 현재 빌드의 619명 고정 구조를 별도로 재구성해야 합니다.</div><div class="split"><section class="card"><div class="row"><div class="field" style="flex:2"><label>선수 검색</label><input id="playerSearch" class="search" placeholder="이름·KBO ID·등 이름 검색" oninput="refreshRosterList()"></div><div class="field"><label>분류</label><select id="categoryFilter" onchange="refreshRosterList()"><option value="">전체</option><option value="P">투수</option><option value="C">포수</option><option value="IF">내야수</option><option value="OF">외야수</option></select></div></div><div class="tablewrap"><table class="roster"><thead><tr><th>선수</th><th>위치</th><th>1군</th><th>번호</th></tr></thead><tbody id="rosterRows"></tbody></table></div></section><section id="playerEdit"></section></div>`;refreshRosterList();renderPlayerEditor()}
function refreshRosterList(){let el=$('rosterRows');if(!el)return;el.innerHTML=playerList().map(p=>`<tr class="${selected===playerKey(p)?'sel':''}" onclick="selectPlayer('${playerKey(p)}')"><td>${esc(p.identity.name)} <span class="small">#${esc(p.identity.index)}</span></td><td>${esc(p.identity.role||p.identity.category)}</td><td><span class="tag ${p.ratings.opening_entry?'active':''}">${p.ratings.opening_entry?'1군':'2군'}</span></td><td>${esc(p.identity.number||'')}</td></tr>`).join('')}
function selectPlayer(k){selected=k;refreshRosterList();renderPlayerEditor()}
function refreshPlayer(){const p=playerByKey(selected);if(!p)return;const name=p.identity.name,code=p.team_code;for(const x of [p.ratings,p.appearance]){x.name=name;x.team=code}p.identity.category=p.ratings.category;p.identity.primary_position=p.ratings.primary_position;p.identity.opening_entry=p.ratings.opening_entry;p.identity.height=p.appearance.height;p.identity.weight=p.appearance.weight;}
function rosterTabs(t){subtab=t;renderPlayerEditor()}
function renderPlayerEditor(){let root=$('playerEdit'),p=selected&&playerByKey(selected);if(!root||!p){if(root)root.innerHTML='<div class="empty">선수를 선택하세요.</div>';return}let i=p.identity,r=p.ratings,a=p.appearance;
let tabs=[['overview','신상·등록'],['ratings','기본 능력치'],['pitching','투구·구종'],['defense','수비 포지션'],['appearance','얼굴·체형']];let body='';
if(subtab==='overview')body=`<div class="playerhead"><img class="portrait" src="${assetUrl(a.photo)}" onerror="this.style.visibility='hidden'"><div><h2 style="margin:0">${esc(i.name)}</h2><div class="small">슬롯 ${i.index} · 선수 ID ${esc(i.player_id)} · 얼굴 ${a.face_id}</div><div class="source">${esc(i.source||a.profile_source||'')}</div></div></div><div class="subsection grid">${input('표시 이름','player.identity.name',i.name)}${input('등 영문 이름','player.back_name',p.back_name||'')}${select('소속 구단','player.team_code',p.team_code,CODES.map(c=>[c,`${ABBR[c]} · ${TEAM_NAMES[c]}`]))}${select('선수 분류','player.identity.category',i.category,[['P','투수'],['C','포수'],['IF','내야수'],['OF','외야수']])}${select('주 포지션','player.ratings.primary_position',r.primary_position,POS.slice(0,9).map((x,n)=>[n,x]))}${input('역할·보직','player.identity.role',i.role||'')}${input('등번호','player.identity.number',i.number||'')}${input('투타','player.identity.hands',i.hands||'')}${input('생년월일','player.identity.birth',i.birth||'','text')}${input('키(cm)','player.appearance.height',a.height,'number',{min:130,max:220})}${input('몸무게(kg)','player.appearance.weight',a.weight,'number',{min:45,max:180})}${input('KBO 프로필 URL','player.identity.profile',i.profile||i.stats_url||'')}${input('기록 기준 연도','player.ratings.last_stat_year',r.last_stat_year||2025,'number',{min:1980,max:2035})}</div><div class="subsection row"><label class="checkbox"><input type="checkbox" ${r.opening_entry?'checked':''} onchange="setVal('player.ratings.opening_entry',this.checked);setVal('player.identity.opening_entry',this.checked);renderPage()">개막 1군 등록</label><label class="checkbox"><input type="checkbox" ${i.foreign?'checked':''} onchange="setVal('player.identity.foreign',this.checked)">외국인 선수</label><label class="checkbox"><input type="checkbox" ${a.dedicated_face?'checked':''} onchange="setVal('player.appearance.dedicated_face',this.checked)">전용 얼굴 텍스처 사용</label></div><div class="subsection"><div class="small">등록 메모 / 출처</div><textarea onchange="setVal('player.identity.source_note',this.value)">${esc(i.source_note||r.estimated_fields?.join(' · ')||'')}</textarea></div>`;

if(subtab==='pitching')body=`<div class="grid">${input('구속(km/h)','player.ratings.velocity',r.velocity,'number',{min:120,max:180})}${input('구종 근거/메모','player.ratings.pitch_basis',r.pitch_basis||'')}</div><div class="subsection"><div class="row"><h3 class="section-title" style="margin:0">구종 목록</h3><button onclick="addPitch()">구종 추가</button></div><p class="small">구종별 변화량·구위·제구는 0~7 범위입니다. 동일 계열 구종은 최대 2개입니다.</p>${r.pitches.map((q,n)=>`<div class="pitchrow"><select onchange="setPitch(${n},'name',this.value)">${PITCHES.map(v=>`<option ${v===q.name?'selected':''}>${v}</option>`).join('')}</select><input title="변화" type="number" min="0" max="7" value="${q.break}" onchange="setPitch(${n},'break',Number(this.value))"><input title="구위" type="number" min="0" max="7" value="${q.stuff}" onchange="setPitch(${n},'stuff',Number(this.value))"><input title="제구" type="number" min="0" max="7" value="${q.control}" onchange="setPitch(${n},'control',Number(this.value))"><button title="삭제" onclick="removePitch(${n})">×</button></div>`).join('')}<div class="small">열 순서: 구종 · 변화량 · 구위 · 제구 · 삭제</div></div>`;
if(subtab==='defense')body=`<div class="notice">수비 위치 등급은 위치별 0~127입니다. 주 포지션은 선수 탭에서 지정합니다.</div><div class="ability">${POS.slice(0,9).map((n,idx)=>input(n,`player.ratings.fielding.${['P','C','1B','2B','3B','SS','LF','CF','RF'][idx]}`,r.fielding[n]??0,'number',{min:0,max:127})).join('')}</div><div class="subsection grid">${input('수비 자료 연도','player.ratings.last_stat_year',r.last_stat_year||2025,'number',{min:1980,max:2035})}${input('등록 분류','player.ratings.category',r.category)}</div>`;
if(subtab==='appearance')body=`<div class="bodypreview"><img id="facePreview" class="facelarge" src="${assetUrl(a.photo)}" onerror="this.src='';this.alt='사진 없음'"><div style="flex:1"><h3 class="section-title">얼굴 사진·체형</h3><div class="small">사진 원본에서 얼굴 위치를 지정해 기존 모델의 64×64 얼굴 텍스처에 합성합니다. 얼굴 ID는 F*.CHK 리소스 번호입니다. 3D 얼굴 골격은 게임 모델이 제공하는 범위 안에서 적용됩니다.</div><div class="field" style="margin-top:12px"><label>새 프로필/얼굴 사진 (PNG/JPG/WEBP, 최대 25MB)</label><input class="file" type="file" accept="image/png,image/jpeg,image/webp" onchange="uploadPlayerPhoto(this)"></div>${input('사진 출처 URL','player.appearance.photo_source',a.photo_source||'')}${input('프로필 출처 URL','player.appearance.profile_source',a.profile_source||'')}</div></div><div class="subsection grid3">${input('얼굴 리소스 ID','player.appearance.face_id',a.face_id,'number',{min:0,max:65535})}${input('체형 슬롯 (0~15)','player.appearance.body_type',a.body_type,'number',{min:0,max:15})}${select('피부 기준 팔레트 ID (0~7)','player.appearance.skin_type',a.skin_type,Array.from({length:8},(_,n)=>[n,`${n}${n<=2?[' · 밝음',' · 중간',' · 어두움'][n]: ' · 추가 팔레트 슬롯'}`]))}${input('피부 기준 머리 ID','player.appearance.skin_reference_head',a.skin_reference_head,'number',{min:0,max:65535})}${input('몸무게(kg)','player.appearance.weight',a.weight,'number',{min:45,max:180})}</div><div class="subsection grid"><div class="field"><label>얼굴 상자 [x,y,w,h] (원본 사진 픽셀)</label><input value="${esc(JSON.stringify(a.face_box||[]))}" onchange="setAppearanceJson('face_box',this.value)"></div><div class="field"><label>눈·코·입 기준점 (5개 [x,y], 원본 사진 픽셀)</label><input value="${esc(JSON.stringify(a.landmarks||[]))}" onchange="setAppearanceJson('landmarks',this.value)"></div></div><div class="small">현재 몸무게 표기는 체형 선택에도 반영할 근거 자료입니다. 몸의 3D 형상/살집을 임의의 새 메쉬로 만들지는 않으며 body_type은 원본 게임 체형 슬롯 선택입니다.</div><div class="subsection">${input('영문 등 이름','player.back_name',p.back_name||'')}</div>`;
root.innerHTML=`<div class="card"><div class="editor-tabs">${tabs.map(([id,label])=>`<button class="${subtab===id?'active':''}" onclick="rosterTabs('${id}')">${label}</button>`).join('')}</div>${body}</div>`;}
function setPitch(n,k,v){let p=playerByKey(selected);p.ratings.pitches[n][k]=v;touch()}
function removePitch(n){let p=playerByKey(selected);p.ratings.pitches.splice(n,1);touch();renderPlayerEditor()}
function addPitch(){let p=playerByKey(selected);p.ratings.pitches.push({name:'포심',break:0,stuff:1,control:1,usage_pct:0});touch();renderPlayerEditor()}
function setAppearanceJson(k,v){try{playerByKey(selected).appearance[k]=JSON.parse(v);touch()}catch(e){toast('JSON 좌표 형식을 확인해 주세요.')}}
function assetUrl(path){if(!path)return '';return path.startsWith('editor_data/')?'/api/resource?path='+encodeURIComponent(path):'/api/resource?path='+encodeURIComponent(path)}
async function uploadPlayerPhoto(inputEl){let f=inputEl.files[0];if(!f)return;try{let data=await readData(f);let r=await api('/api/upload',{scope:'players',key:playerKey(playerByKey(selected)).replace('|','_'),slot:'face_photo',filename:f.name,data});let p=playerByKey(selected);p.appearance.photo=r.path;p.appearance.photo_sha256=r.sha256;p.appearance.photo_source='편집기 업로드: '+f.name;touch();renderPlayerEditor();toast('사진을 초안 자산에 저장했습니다.')}catch(e){toast(e.message)}}
function readData(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(file)})}
function renderTeam(){let t=state.teams[team],b=t.branding;let colorFields=COLOR_KEYS.filter(k=>Array.isArray(b[k]));let files=t.art_assets?Object.entries(t.art_assets).filter(([k,v])=>k!=='_available'&&v):[];let available=t.art_assets?._available||[];
$('main').innerHTML=`<div class="pagehead"><div><h1>${esc(t.name)} 구단·구장·유니폼 편집</h1><p>구단 표기, 연고지, 구장 모델/명칭, 유니폼 색상 및 교체용 그래픽을 편집합니다.</p></div><span class="pill">구단 코드 ${team} · 리소스 ${esc(b.uniform||'')}</span></div><div class="notice">구장 구조·충돌·조명·UV는 게임 리소스별 적용 작업이 필요합니다. 이 편집기는 값과 파일을 모아 Codex 입력으로 내보냅니다. 유니폼 색상이나 로고만 저장해도 게임 파일이 자동 변경되지는 않습니다.</div><div class="editor-tabs"><button class="active">구단과 구장</button><button onclick="document.getElementById('uniformCard').scrollIntoView({behavior:'smooth'})">유니폼</button><button onclick="document.getElementById('assetsCard').scrollIntoView({behavior:'smooth'})">로고·이미지</button><button onclick="showAdvancedBrand()">고급 JSON</button></div><section class="card"><h2 class="section-title">구단 표기</h2><div class="grid">${input('정식 구단명','team.name',t.name)}${input('짧은 구단명','team.short_name',t.short_name)}${input('한 글자 약칭 (고정 대응표)','team.abbreviation',t.abbreviation)}${input('연고 도시','team.branding.city',b.city||'')}${input('게임 구단 ID (고정)','team.branding.team_id',b.team_id,'number',{min:0,max:9})}${input('게임 유니폼 리소스 키','team.branding.uniform',b.uniform||'')}</div></section><section class="card"><h2 class="section-title">홈 구장</h2><div class="grid3">${input('홈 구장 이름','team.branding.stadium_name',b.stadium_name||'')}${input('짧은 표기','team.branding.stadium_short',b.stadium_short||'')}${input('화면 표시 이름','team.branding.stadium_display_name',b.stadium_display_name||b.stadium_short||'')}${input('영문 표기','team.branding.stadium_english',b.stadium_english||'')}${input('구장 슬롯 ID','team.branding.stadium_slot',b.stadium_slot??0,'number',{min:0,max:15})}${input('원본 모델 이름','team.branding.stadium_model',b.stadium_model||'')}</div><div class="small" style="margin-top:10px">모델 선택은 원 게임 구장 리소스 이름입니다. 좌우·중앙 거리, 펜스 높이, 잔디 종류 등 추가 수치는 아래 고급 JSON에 stadium_specs로 보관할 수 있습니다.</div></section><section id="uniformCard" class="card"><h2 class="section-title">유니폼 색상·스타일</h2><div class="grid3">${colorFields.map(k=>`<div class="field coloritem"><label>${esc(({cap_color:'모자',home_color:'홈',away_color:'원정',alternate_color:'대체',pants_color:'바지',home_letter_color:'홈 글자',away_letter_color:'원정 글자',side_color:'옆선'})[k]||k)} ${b[k].join(',')}</label><input type="color" value="${rgbHex(b[k])}" onchange="setColor('${k}',this.value)"></div>`).join('')}${input('홈/원정 구분 재봉선 기준','team.branding.front_seam',JSON.stringify(b.front_seam||[]))}</div><div class="row subsection"><label class="checkbox"><input type="checkbox" ${b.pinstripe?'checked':''} onchange="setVal('team.branding.pinstripe',this.checked)">핀스트라이프</label><label class="checkbox"><input type="checkbox" ${b.plain_template?'checked':''} onchange="setVal('team.branding.plain_template',this.checked)">기본 UV 템플릿</label></div></section><section id="assetsCard" class="card"><div class="row"><h2 class="section-title" style="margin:0">로고·유니폼 참고 이미지</h2><span class="small">기존 자료는 미리보기, 새 파일은 패키지에 포함</span></div><div class="assetgrid" style="margin-top:12px">${['logo','cap','home_word','away_word','uniform_reference','stadium_reference'].map(slot=>renderAssetCard(slot,t.art_assets?.[slot])).join('')}</div><div class="subsection"><div class="small">기존 팀 자료에서 선택</div><div class="row">${available.map(f=>`<button onclick="chooseSourceAsset('${esc(f)}')">${esc(f)}</button>`).join('')}</div></div></section><section class="card"><h2 class="section-title">홈 구장 광고판·원본 참조</h2><div class="field"><label>구장 광고판 타깃 ID 배열 (기존 asset mapping 보존)</label><textarea class="jsonarea" onchange="setBrandJson('ads',this.value)">${esc(JSON.stringify(b.ads||[],null,2))}</textarea></div><div class="small">실제 광고판 UV ID, 소유 자원, 낮/밤 버전이 확인된 항목만 변경하세요. 원본 resource_map, uv_overrides, donor_slot은 고급 JSON에서 유지·편집할 수 있습니다.</div></section><div id="advancedBrand" class="card hidden"><h2 class="section-title">구단 전체 고급 설정 JSON</h2><textarea id="brandJson" class="jsonarea"></textarea><button onclick="applyBrandJson()">전체 JSON 적용</button></div>`}
function rgbHex(a){return '#'+a.slice(0,3).map(v=>Math.round(v).toString(16).padStart(2,'0')).join('')}
function setColor(key,hex){let v=hex.slice(1).match(/../g).map(x=>parseInt(x,16));setVal('team.branding.'+key,v);renderTeam()}
function setBrandJson(k,value){try{state.teams[team].branding[k]=JSON.parse(value);touch()}catch(e){toast('JSON 배열을 확인해 주세요.')}}
function showAdvancedBrand(){let x=$('advancedBrand');x.classList.remove('hidden');$('brandJson').value=JSON.stringify(state.teams[team].branding,null,2);x.scrollIntoView({behavior:'smooth'})}
function applyBrandJson(){try{state.teams[team].branding=JSON.parse($('brandJson').value);touch();renderTeam();toast('고급 구단 설정을 적용했습니다.')}catch(e){toast('JSON 형식 오류: '+e.message)}}
function renderAssetCard(slot,path){let preview=path?(typeof path==='string'?path:path.path):'';return `<div class="assetcard"><b>${esc(({logo:'엠블럼/로고',cap:'모자 표장',home_word:'홈 유니폼 글자',away_word:'원정 유니폼 글자',uniform_reference:'유니폼 전체 참고',stadium_reference:'구장 참고 이미지'})[slot])}</b><div class="assetpreview">${preview?`<img src="${assetUrl(preview)}" onerror="this.alt='원본 미리보기 없음'">`:'파일 없음'}</div><div class="small">${esc(preview||'아직 등록되지 않음')}</div><input class="file" type="file" accept="image/png,image/jpeg,image/webp" onchange="uploadTeamAsset('${slot}',this)"></div>`}
async function uploadTeamAsset(slot,el){let f=el.files[0];if(!f)return;try{let r=await api('/api/upload',{scope:'teams',key:team,slot,filename:f.name,data:await readData(f)});state.teams[team].art_assets[slot]={path:r.path,sha256:r.sha256,filename:f.name};touch();renderTeam();toast('구단 이미지 자산을 저장했습니다.')}catch(e){toast(e.message)}}
function chooseSourceAsset(file){let dir=state.teams[team].branding.asset_dir;if(!dir){toast('이 구단에 연결된 기존 이미지 폴더가 없습니다.');return}let name=prompt('선택할 이미지 슬롯을 입력하세요: logo, cap, home_word, away_word, uniform_reference','logo');if(!name)return;state.teams[team].art_assets[name]=`${dir}/${file}`;touch();renderTeam()}
function renderLineup(){let t=state.teams[team],lp=t.lineup,ps=teamPlayers().filter(p=>p.identity.category!=='P'&&p.ratings.opening_entry);let bats=ps.map(p=>p.identity.name),pitchers=teamPlayers().filter(p=>p.identity.category==='P'&&p.ratings.opening_entry).map(p=>p.identity.name);$('main').innerHTML=`<div class="pagehead"><div><h1>${esc(t.name)} 개막 편성</h1><p>선발 타순, 주 포지션, 선발 로테이션, 마무리 투수를 편집합니다.</p></div><span class="pill">현재 1군 ${teamPlayers().filter(p=>p.ratings.opening_entry).length}/29</span></div><div class="notice">각 선수는 이름 대신 게임 슬롯 연결을 유지합니다. 타순/보직을 바꾸면 이름과 카테고리 검사 후 Codex용 패키지에 포함됩니다.</div><div class="card"><h2 class="section-title">선발 타순과 수비 위치</h2>${lp.starters.map((s,n)=>`<div class="lineup-row"><select onchange="setStarter(${n},'name',this.value)">${bats.map(x=>`<option ${x===s.name?'selected':''}>${esc(x)}</option>`).join('')}</select><select onchange="setStarter(${n},'position',this.value)">${POS.slice(0,10).map(x=>`<option ${x===s.position?'selected':''}>${x}</option>`).join('')}</select><span class="small">${n+1}번</span></div>`).join('')}</div><div class="card"><h2 class="section-title">선발 로테이션</h2>${lp.rotation.map((n,i)=>`<div class="row" style="margin:6px 0"><span class="pill">${i+1}선발</span><select onchange="setRotation(${i},this.value)">${pitchers.map(x=>`<option ${x===n?'selected':''}>${esc(x)}</option>`).join('')}</select><button onclick="removeRotation(${i})">삭제</button></div>`).join('')}<button onclick="addRotation()">선발 추가</button><div class="grid subsection">${select('마무리 투수','team.lineup.closer',lp.closer,pitchers.map(n=>[n,n]))}</div></div>`}
function setStarter(i,k,v){state.teams[team].lineup.starters[i][k]=v;const slot=state.teams[team].lineup.starters[i],pos={'P':0,'C':1,'1B':2,'2B':3,'3B':4,'SS':5,'LF':6,'CF':7,'RF':8}[slot.position];if(slot.position!=='DH'){const p=teamPlayers().find(x=>x.identity.name.replace(/\s/g,'')===slot.name.replace(/\s/g,''));if(p&&pos!==undefined&&pos<9){p.ratings.primary_position=pos;p.identity.primary_position=pos}}touch()}function setRotation(i,v){state.teams[team].lineup.rotation[i]=v;touch()}function addRotation(){let p=teamPlayers().find(x=>x.identity.category==='P'&&x.ratings.opening_entry);state.teams[team].lineup.rotation.push(p?.identity.name||'');touch();renderLineup()}function removeRotation(i){state.teams[team].lineup.rotation.splice(i,1);touch();renderLineup()}
function renderStaff(){let t=state.teams[team];$('main').innerHTML=`<div class="pagehead"><div><h1>${esc(t.name)} 감독·코치</h1><p>현재 다섯 스태프 슬롯을 수정합니다. 역할 구분과 표시명을 같이 입력합니다.</p></div><span class="pill">${t.staff.length}명 등록</span></div><div class="notice">게임 코치 슬롯 수는 기존 팀 자료의 슬롯 수에 맞춥니다. 인원을 추가하거나 삭제하면 리소스 슬롯 재구성 작업이 필요합니다.</div>${t.staff.map((s,i)=>`<div class="card"><div class="grid3">${input('이름',`team.staff.${i}.name`,s.name)}${input('역할',`team.staff.${i}.role`,s.role||s.kind||'코치')}${input('게임 슬롯 (보호됨)',`team.staff.${i}.index`,s.index,'number',{min:0,max:2534,readonly:true})}${input('등번호/표기',`team.staff.${i}.number`,s.number||'')}${input('출처/메모',`team.staff.${i}.source`,s.source||'')}${input('보직 설명',`team.staff.${i}.title`,s.title||'')}</div></div>`).join('')}`}
async function saveDraft(){if(!state)return;try{let r=await api('/api/save',state);base=JSON.parse(JSON.stringify(state));dirty=false;$('saveStatus').textContent='저장 '+new Date().toLocaleTimeString('ko-KR');$('saveStatus').style.color='var(--green)';toast(`초안을 저장했습니다. 선수 ${r.players}명`)}catch(e){toast('저장 실패: '+e.message)}}
async function exportInput(){if(!state)return;let button=$('exportBtn');button.disabled=true;try{await api('/api/save',state);let r=await api('/api/export',state);dirty=false;$('saveStatus').textContent='패키지 생성 완료';$('saveStatus').style.color='var(--green)';let a=document.createElement('a');a.href=r.download;a.download='KBO_editor_input.zip';a.click();toast(`Codex 입력 패키지 생성: 변경 선수 ${r.players_changed}명 · 변경 구단 ${r.teams_changed}개`)}catch(e){toast('내보내기 검사 오류:\n'+e.message)}finally{button.disabled=false}}
function showHelp(){ $('helpContent').innerHTML=`<div class="notice">이 도구는 기존 KBO 2026 패치 입력을 편집합니다. 원본 게임 데이터와 ID/슬롯 연결을 보존하고, ISO는 만들지 않습니다.</div><h3>편집할 수 있는 항목</h3><ul><li>619명 선수: 이름, KBO 소속, 1군/2군, 보직, 생년월일, 등번호, 영문 등 이름, 투타, 키·몸무게, 프로필</li><li>모든 기본 능력치와 위치별 수비, 구속, 구종·변화·구위·제구</li><li>얼굴 사진 업로드, 얼굴 텍스처 ID, 얼굴 상자/눈·코·입 기준점, 피부 톤, 체형 슬롯, 신체 정보</li><li>10개 구단 이름/약칭/연고지, 유니폼 색상·스타일, 로고/모자/홈·원정 글자/참고 이미지 업로드</li><li>구장 이름·짧은 표기·모델/슬롯, 광고판 적용 ID, 선발 타순·포지션·로테이션·마무리, 감독·코치</li></ul><h3>저장·Codex 전달</h3><p>초안은 작업 폴더의 editor_data/draft.json에 보관합니다. Codex 입력 패키지를 내보내면 전체 편집 자료, 기준 대비 변경 목록, 새 이미지 자산이 ZIP으로 저장·다운로드되고 editor_data/exports/KBO_editor_input_latest.zip에도 기록됩니다. 이 작업에서 최신 패키지 반영을 요청하면 실제 소스 수정과 정적 검증을 진행하고, ISO 빌드는 별도 요청/지시대로 진행할 수 있습니다.</p><p>새 선수 추가/삭제, 게임 슬롯/KBO ID 변경, 선수 레코드 확장은 이 버전에서 막습니다. 현재 빌드가 619개 선수 슬롯에 연결되어 있기 때문입니다. 선수 간 구단 이동과 1·2군 분류 변경은 지원하지만, 모든 구단 1군은 29명이어야 내보낼 수 있습니다.</p><p>얼굴 사진을 바꾸면 사진합성/CHK 텍스처 작업, 로고·유니폼을 바꾸면 UV와 팔레트에 맞춘 구단별 리소스 작업이 남습니다. 편집 패키지는 이러한 작업 지침을 전달하며 게임 파일을 직접 고치지 않습니다. 원본 모델에는 선택 가능한 체형/얼굴 범위가 있고 신규 3D 모델 제작은 지원하지 않습니다.</p><h3>검사 규칙</h3><p>능력치 저장 한계, 구종 범위와 중복, 팀·슬롯 연결, 1군 인원, 선발/마무리·타순 명단, 이미지 해시를 검사합니다. 현재 입력 원본의 SHA-256을 ZIP에 넣어 다른 빌드 기준과 혼동되지 않게 합니다.</p>`;$('help').classList.remove('hidden')}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});init();
</script></body></html>
